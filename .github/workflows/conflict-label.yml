name: Conflict label

on:
  push:
    branches: [main]
  pull_request_target:
    types: [synchronize]
  workflow_dispatch:

permissions: {}

concurrency:
  group: conflict-label
  cancel-in-progress: true

jobs:
  label:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - uses: eps1lon/actions-label-merge-conflict@v3
        with:
          dirtyLabel: needs rebase
          repoToken: ${{ secrets.GITHUB_TOKEN }}
